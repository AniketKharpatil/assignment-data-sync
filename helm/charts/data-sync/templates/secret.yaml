{{/*
REDIS_PASSWORD.

Rendered ONLY when the caller has not supplied secret.existingSecret. In
staging/production the Secret is created outside Helm (External Secrets
Operator syncing from AWS Secrets Manager), which is why this file is a no-op
there: a Helm-rendered secret ends up in release state and in any values file
that sets it.

helm.sh/resource-policy: keep prevents `helm uninstall` from deleting the
credential out from under a Redis instance that outlives the release.
*/}}
{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-sync.secretName" . }}
  labels:
    {{- include "data-sync.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.secret.key }}: {{ required "secret.password is required when secret.existingSecret is empty" .Values.secret.password | quote }}
{{- end }}
