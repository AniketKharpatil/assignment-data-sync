{{/*
Prometheus Operator ServiceMonitor: scrapes /metrics every 30s.

The `release: kube-prometheus-stack` label is the discovery contract - the
kube-prometheus-stack Prometheus is configured with a serviceMonitorSelector
matching it. Without that label the object applies cleanly and is silently
never scraped, which is the failure mode this comment exists to prevent.

Gated on .Capabilities so `helm template` (no cluster) still renders it while
a real install against a cluster without the Prometheus Operator CRDs skips it
instead of failing. Use --api-versions with `helm template` to test the
negative case.
*/}}
{{- if .Values.serviceMonitor.enabled }}
{{- if or (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") (not .Values.serviceMonitor.requireCRD) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "data-sync.fullname" . }}
  labels:
    {{- include "data-sync.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "data-sync.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      scheme: http
{{- end }}
{{- end }}
