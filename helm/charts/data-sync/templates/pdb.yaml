{{/*
PodDisruptionBudget - protects against voluntary disruption (node drains, upgrades).
minAvailable: 1 per spec. Trade-off: with 3 replicas, a drain can evict 2 pods.
maxUnavailable: 1 is safer for production; chart supports both.
*/}}
{{- if .Values.podDisruptionBudget.enabled }}
{{- if and (not .Values.autoscaling.enabled) (not .Values.podDisruptionBudget.maxUnavailable) (kindIs "int64" .Values.podDisruptionBudget.minAvailable) }}
{{- if and (gt (int .Values.replicaCount) 1) (ge (int .Values.podDisruptionBudget.minAvailable) (int .Values.replicaCount)) }}
{{- fail (printf "podDisruptionBudget.minAvailable (%v) must be less than replicaCount (%v), otherwise node drains block forever" .Values.podDisruptionBudget.minAvailable .Values.replicaCount) }}
{{- end }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "data-sync.fullname" . }}
  labels:
    {{- include "data-sync.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "data-sync.selectorLabels" . | nindent 6 }}
{{- end }}
