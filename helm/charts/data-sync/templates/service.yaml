{{/*
ClusterIP Service. The port is named `http` so the ServiceMonitor selects it
by name - a numeric reference would silently break if the container port
changed.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-sync.fullname" . }}
  labels:
    {{- include "data-sync.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "data-sync.selectorLabels" . | nindent 4 }}
