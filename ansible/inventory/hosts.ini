# Example inventory. Real hosts come from a dynamic inventory plugin (aws_ec2 / gcp_compute) in the actual platform repo.
#
# be_role is the gate the be-* roles check: be-data-sync only acts on hosts
# where be_role == 'service'.

[service]
vm-service-01.example.com
vm-service-02.example.com

[service:vars]
be_role=service

# Present to show the gate working: the role skips these hosts entirely.
[analytics]
vm-clickhouse-01.example.com

[analytics:vars]
be_role=clickhouse

[all:vars]
ansible_python_interpreter=/usr/bin/python3.9
