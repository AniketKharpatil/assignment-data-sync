[defaults]
# Naming the inventory here is what makes group_vars/ load deterministically,
# regardless of the directory ansible-playbook is invoked from.
inventory = inventory/hosts.ini
roles_path = roles

host_key_checking = True
stdout_callback = yaml
bin_ansible_callbacks = True

# Surface skipped hosts - the be_role gate skips whole hosts, and silent skips
# make a no-op run look like a successful one.
display_skipped_hosts = True

[privilege_escalation]
become = False
become_method = sudo

[ssh_connection]
pipelining = True
