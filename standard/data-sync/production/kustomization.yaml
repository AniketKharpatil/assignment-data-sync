# ============================================================================
# Workload-level production overlay for data-sync.
#
# Build (no flags, no helm binary, no network):
#   kubectl kustomize standard/data-sync/production
#   kustomize build   standard/data-sync/production
#
# How the chart gets in here (base/manifests.yaml):
#   `helm template` output is committed as a base, regenerated by
#   ./extras/scripts/render-base.sh. Run it with --check in CI and it fails on a
#   diff, so the base cannot silently drift from the chart.
# ============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data-sync

resources:
  - base/manifests.yaml

patches:
  # Spread pods across AWS AZs. topologySpreadConstraints has no list merge key, so we have to patch the whole list.
  - path: patch-topology-spread.yaml
    target:
      kind: Deployment
      name: data-sync

  # SECRET_CHECKSUM annotation on the pod template, so a Redis password rotation triggers a normal rolling update.
  - path: patch-secret-checksum.yaml
    target:
      kind: Deployment
      name: data-sync

# Cluster-identifying labels on every object. includeSelectors: false is
# essential - a Deployment's spec.selector is immutable, so adding these to
# selectors would make every future apply fail on the live object.
labels:
  - includeSelectors: false
    pairs:
      cluster-tier: production
