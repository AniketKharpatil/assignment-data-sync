# SECRET_CHECKSUM triggers rolling update when Redis password rotates.
#
# Env vars resolve at container start - updating the Secret doesn't restart pods,
# so they keep the old password until something forces a restart.
#
# This annotation changes the pod template hash, triggering a controlled rollout
# (honoring maxUnavailable=0 and PDB) when CD replaces "replace-at-deploy-time" with the live Secret checksum.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-sync
spec:
  template:
    metadata:
      annotations:
        SECRET_CHECKSUM: "replace-at-deploy-time"
